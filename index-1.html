<style>
:root{--tint:#007aff;--ok:#34c759;--wn:#ff9500;--rd:#ff3b30;--bg:#f2f2f7;--card:#fff;--ink:#000;--mu:rgba(60,60,67,.6);--sep:rgba(60,60,67,.16);--glass:rgba(255,255,255,.6);--rim:rgba(255,255,255,.75);--sh:0 10px 32px rgba(0,0,0,.12);--okb:rgba(52,199,89,.15);--wnb:rgba(255,149,0,.16);--rdb:rgba(255,59,48,.13);--tb:rgba(0,122,255,.1);--f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Segoe UI",Roboto,sans-serif;--fr:ui-rounded,"SF Pro Rounded",var(--f);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--tint:#0a84ff;--ok:#30d158;--wn:#ff9f0a;--rd:#ff453a;--bg:#000;--card:#1c1c1e;--ink:#fff;--mu:rgba(235,235,245,.6);--sep:rgba(84,84,88,.55);--glass:rgba(44,44,48,.55);--rim:rgba(255,255,255,.14);--sh:0 10px 32px rgba(0,0,0,.55);--tb:rgba(10,132,255,.2);--okb:rgba(48,209,88,.18);--wnb:rgba(255,159,10,.18);--rdb:rgba(255,69,58,.18)}}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--f);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(70% 38% at 10% -4%,rgba(0,122,255,.2),transparent),radial-gradient(60% 34% at 100% 12%,rgba(52,199,89,.15),transparent)}
button,input{font-family:inherit}
:focus-visible,.btn:focus-within{outline:3px solid var(--tint);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--rim);box-shadow:var(--sh)}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;border-bottom:.5px solid transparent;transition:background .25s,border-color .25s}
body.sc .bar{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border-bottom-color:var(--sep)}
.bt{position:absolute;left:0;right:0;text-align:center;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
body.sc .bt{opacity:1}
.rb{margin-left:auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--tint);cursor:pointer;padding:0;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.rb svg{width:22px;height:22px}
.rb:active,.btn:active{transform:scale(.94)}
.w{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 62px) 16px calc(116px + env(safe-area-inset-bottom,0px))}
h1{font:700 34px/1.1 var(--f);letter-spacing:-.02em;margin:0}
.sub{margin:6px 0 0;font-size:13px;color:var(--mu)}
h2{font:700 21px/1.2 var(--f);letter-spacing:-.01em;margin:30px 0 10px 4px}
.note{font-size:13px;color:var(--mu);margin:8px 4px 0}
.up{color:var(--ok)}.dn{color:var(--rd)}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
.k{background:var(--card);border-radius:22px;padding:16px}
.k:first-child{grid-column:1/-1}
.k b{display:block;font:700 26px/1.1 var(--fr);letter-spacing:-.02em;margin:4px 0}
.k:first-child b{font-size:42px}
.k span{display:block;font-size:13px;color:var(--mu)}
.k span.up{color:var(--ok)}.k span.dn{color:var(--rd)}
.act{list-style:none;margin:0;padding:0;background:var(--card);border-radius:22px;overflow:hidden}
.act li{position:relative;padding:14px 16px 14px 40px;font-size:15px}
.act li+li{border-top:.5px solid var(--sep)}
.act li::before{content:"";position:absolute;left:16px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--ok)}
.act li.wn::before{background:var(--wn)}.act li.rd::before{background:var(--rd)}
.sc{background:var(--card);border-radius:22px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-weight:500;font-size:12.5px;color:var(--mu);padding:12px 16px 8px;text-align:left;white-space:nowrap}
td{padding:12px 16px;border-top:.5px solid var(--sep);white-space:nowrap}
td:first-child{font-weight:600}
td small{display:block;color:var(--mu);font-size:12px;font-weight:400}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--tb);color:var(--mu)}
.t-g{background:var(--okb);color:var(--ok)}.t-w{background:var(--wnb);color:var(--wn)}.t-r{background:var(--rdb);color:var(--rd)}
#main>svg{display:block;width:100%;background:var(--card);border-radius:22px;padding:14px 8px 4px}
#main svg text{font:11px var(--f);fill:var(--mu)}
.z{fill:var(--tb)}.ax{stroke:var(--sep)}.ar{fill:url(#g)}
.l1{fill:none;stroke:var(--tint);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s .1s cubic-bezier(.3,.7,.2,1) forwards}
.l2{fill:none;stroke:var(--tint);stroke-width:3;stroke-linecap:round;stroke-dasharray:1 7;opacity:.8}
.dot{fill:var(--tint);stroke:var(--card);stroke-width:2.5}
@keyframes dr{to{stroke-dashoffset:0}}
.btn{display:inline-block;border:0;background:var(--tb);color:var(--tint);font:600 15px var(--f);padding:11px 18px;border-radius:99px;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.btn.fill{background:var(--tint);color:#fff}
.vh{position:absolute;opacity:0;width:1px;height:1px}
.chips{background:var(--card);border-radius:22px;overflow:hidden;margin:16px 0}
.chips .btn{display:flex;justify-content:space-between;width:100%;border-radius:0;background:none;text-align:left;font-weight:500;padding:14px 16px}
.chips .btn+.btn{border-top:.5px solid var(--sep)}
.chips .btn::after{content:"\203A";color:var(--mu);font-size:20px;line-height:1}
.chips .btn:active{transform:none;background:var(--sep)}
.ask{display:flex;gap:8px;margin:0 0 20px}
.ask input{flex:1;min-width:0;font-size:16px;padding:11px 18px;border:1px solid var(--rim);border-radius:99px;background:var(--glass);color:var(--ink);outline:none}
.ask input:focus{border-color:var(--tint);box-shadow:0 0 0 3px var(--tb)}
.ask .btn{background:var(--tint);color:#fff}
.msg{margin:0 0 16px}
.msg .q{width:fit-content;max-width:86%;margin:0 0 8px auto;background:var(--tint);color:#fff;padding:9px 15px;border-radius:21px 21px 6px 21px}
.msg .a{background:var(--card);border-radius:21px 21px 21px 6px;padding:12px 16px;max-width:94%;font-size:15px}
.msg .a p{margin:0 0 8px}.msg .a p:last-child,.msg .a ul:last-child{margin-bottom:0}.msg .a ul{margin:0 0 8px;padding-left:18px}
.tabs{--i:0;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 24px),440px);height:66px;z-index:20;border-radius:33px;display:grid;grid-template-columns:repeat(5,1fr);padding:4px}
.tabs::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/5);border-radius:29px;background:var(--tb);transform:translateX(calc(var(--i)*100%));transition:transform .55s cubic-bezier(.34,1.45,.5,1)}

<body>
<div class="bar"><span class="bt" id="bt"></span><button class="rb glass" id="ds" aria-label="Your data"><svg class="ic" viewBox="0 0 24 24"><path d="M12 15V4m0 0L8 8m4-4 4 4"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></button></div>
<main class="w"><h1 id="lt">Overview</h1><p class="sub" id="sn"></p><div id="main"></div></main>
<nav class="tabs glass" id="tabs" role="tablist">

<button role="tab" data-t="inv"><svg class="ic" viewBox="0 0 24 24"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></svg>Inventory</button>
<button role="tab" data-t="cu"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 3-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.2c2.4.2 4 1.8 4.5 4.3"/></svg>Customers</button>
<button role="tab" data-t="al"><svg class="ic" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/></svg>Alerts</button>

<div class="sh" id="sh"><div class="bd" data-close></div><div class="sheet glass" role="dialog" aria-label="Your data"><div class="grab"></div><h3>Your data</h3>
<p class="note">Upload a sales CSV. Required columns: date, product, qty, price. Optional: bill, customer, category, cost, stock (current units). Dates as 2026-10-05 or 05/10/2026. Your file stays on this device.</p>
<p id="msg" role="status"></p>
<div class="row"><label class="btn fill">Upload CSV<input class="vh" id="f" type="file" accept=".csv,text/csv"></label><button class="btn" id="bs">Use sample data</button></div></div></div>
<script>
const $=i=>document.getElementById(i);
const inr=n=>{const a=Math.abs(Math.round(n)),s=n<0?'-':'';return a>=1e7?s+'₹'+(a/1e7).toFixed(2)+' cr':a>=1e5?s+'₹'+(a/1e5).toFixed(2)+' L':s+'₹'+a.toLocaleString('en-IN')};
const pct=x=>isFinite(x)?(x>=0?'+':'')+Math.round(x*100)+'%':'new';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dfmt=d=>new Date(d*864e5).toLocaleDateString('en-IN',{day:'numeric',month:'short',timeZone:'UTC'});
const iso=d=>new Date(d*864e5).toISOString().slice(0,10);
const wd=d=>['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][(d+4)%7];
const sum=(a,i,j)=>{let s=0;for(let k=Math.max(i,0);k<=j;k++)s+=a[k]||0;return s};
const li=a=>'<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
const num=x=>{const v=parseFloat(String(x==null?'':x).replace(/[₹,\s]/g,''));return isNaN(v)?null:v};
const msg=t=>{$('msg').textContent=t};
let A=null,tab='ov',chat=[];
const TABS=[['ov','Overview'],['inv','Inventory'],['cu','Customers'],['al','Alerts'],['ask','Ask']];

function csv(t){const rows=[];let f='',row=[],q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
function pd(s){s=String(s||'').trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return Date.UTC(+m[1],m[2]-1,+m[3])/864e5;m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);return m?Date.UTC(+m[3],m[2]-1,+m[1])/864e5:NaN}

function sample(){
 let s=11;const R=()=>(s=(s*1664525+1013904223)%4294967296)/4294967296;
 const P=[["Formal Shirt M","Formal shirts",899,520,9,18],["Formal Shirt L","Formal shirts",899,520,6,40],["Slim Denim 32","Denim",1499,880,7,60],["Slim Denim 34","Denim",1499,880,5,70],["Printed Kurta XL","Ethnic wear",1199,650,6,25],["Kurta M","Ethnic wear",1099,600,5,45],["Heavy Jacket L","Winter wear",2999,1900,4,60],["Hoodie M","Winter wear",1799,1050,3,35],["Polo Tee M","T-shirts",599,310,8,90],["Graphic Tee L","T-shirts",499,250,7,140]];
 const T=Math.floor(Date.now()/864e5),rows=[];let bill=1000;
 for(let i=-179;i<=0;i++){
  const d=T+i,dow=(d+4)%7;let n=22+(i+179)*.03+(dow==0||dow==6?9:0)+R()*6;
  if(i>-60&&i<-54)n*=1.7;if(i>-12)n*=.78;if(i==-9)n*=.2;n=Math.round(n);
  const w=P.map(p=>p[4]*(p[1]=="Winter wear"&&i>-45?.2:1)*(p[1]=="Ethnic wear"&&i>-30?1.5:1)),tw=w.reduce((a,v)=>a+v,0);
  for(let b=0;b<n;b++){
   const c="C"+(1+Math.floor(R()*R()*130)),k=R()<.35?2:1,id="B"+(bill++);
   for(let j=0;j<k;j++){let x=R()*tw,q=0;while(q<w.length-1&&x>w[q]){x-=w[q];q++}
    const p=P[q];rows.push({d,bill:id,cust:c,prod:p[0],cat:p[1],qty:1+(R()<.15?1:0),price:p[2],cost:p[3],stock:p[5]})}}}
 return rows}

function analyse(R){
 let lo=1e9,hi=-1e9;R.forEach(r=>{if(r.d<lo)lo=r.d;if(r.d>hi)hi=r.d});
 const n=hi-lo+1,Z=()=>Array(n).fill(0),S=Z(),G=Z(),Bs=Array.from({length:n},()=>new Set()),P={},K={};let hasCost=false;
 R.forEach(r=>{const i=r.d-lo,v=r.qty*r.price,g=r.cost!=null?r.qty*(r.price-r.cost):0;if(r.cost!=null)hasCost=true;S[i]+=v;G[i]+=g;Bs[i].add(r.bill);
  const p=P[r.prod]=P[r.prod]||{prod:r.prod,cat:r.cat,u:Z(),v:Z(),g:Z(),stock:null,cost:null,sd:-1};
  p.u[i]+=r.qty;p.v[i]+=v;p.g[i]+=g;if(r.stock!=null&&r.d>=p.sd){p.stock=r.stock;p.sd=r.d}if(r.cost!=null)p.cost=r.cost;
  if(r.cust){const c=K[r.cust]=K[r.cust]||{id:r.cust,rev:0,b:new Set(),last:0};c.rev+=v;c.b.add(r.bill);if(r.d>c.last)c.last=r.d}});
 const k=Math.min(30,Math.floor(n/2)),w=a=>sum(a,n-k,n-1),pv=a=>sum(a,n-2*k,n-k-1);
 const bl=(i,j)=>{const s=new Set();for(let x=Math.max(i,0);x<=j;x++)Bs[x].forEach(b=>s.add(b));return s.size};
 const dw=Array(7).fill(0),dc=Array(7).fill(0);for(let i=Math.max(0,n-28);i<n;i++){const o=(lo+i+4)%7;dw[o]+=S[i];dc[o]++}
 const p28=sum(S,n-56,n-29),f=p28>0&&n>=56?Math.min(1.15,Math.max(.85,Math.sqrt(sum(S,n-28,n-1)/p28))):1,F=[];
 for(let h=1;h<=30;h++){const o=(lo+n-1+h+4)%7;F.push(dc[o]?dw[o]/dc[o]*f:0)}
 const an=[];for(let i=Math.max(56,n-60);i<n;i++){const h=[];for(let j=1;j<=8;j++)h.push(S[i-7*j]);const m=h.reduce((a,b)=>a+b,0)/8,sd=Math.sqrt(h.reduce((a,b)=>a+(b-m)**2,0)/8),z=(S[i]-m)/Math.max(sd,m*.05,1);if(Math.abs(z)>2.5)an.push({d:lo+i,v:S[i],m,z})}
 const pr=Object.values(P).map(p=>{p.u30=w(p.u);p.up30=pv(p.u);p.rev=w(p.v);p.rp=pv(p.v);p.gp=w(p.g);p.vel=p.u30/k;const st=p.stock;
  p.cover=st==null?null:st<=0?0:p.vel>0?st/p.vel:Infinity;
  p.re=p.cover!=null&&p.vel>0&&p.cover<21;p.slow=!p.re&&((p.cover!=null&&p.stock>0&&p.cover>90)||(p.up30>=6&&p.u30<p.up30*.5));
  p.rise=!p.re&&!p.slow&&p.up30>=5&&p.u30>p.up30*1.3;p.q=p.re?Math.max(1,Math.ceil(p.vel*45-p.stock)):0;return p});
 const cm={};pr.forEach(p=>{const c=cm[p.cat]=cm[p.cat]||{cat:p.cat,rev:0,rp:0,gp:0};c.rev+=p.rev;c.rp+=p.rp;c.gp+=p.gp});
 return{lo,hi,n,k,S,F,an,pr,hasCost,sales:w(S),prev:pv(S),gp:w(G),bills:bl(n-k,n-1),pbills:bl(n-2*k,n-k-1),
  hasStock:pr.some(p=>p.stock!=null),hasCust:Object.keys(K).length>0,ct:Object.values(cm).sort((a,b)=>b.rev-a.rev),
  locked:pr.reduce((s,p)=>s+(p.slow&&p.stock>0&&p.cost!=null?p.stock*p.cost:0),0),
  cu:Object.values(K).map(c=>({id:c.id,rev:c.rev,nb:c.b.size,gap:hi-c.last}))}}

function acts(){
 const o=[],d=A.sales/(A.prev||1)-1;
 A.pr.filter(p=>p.re).sort((a,b)=>b.vel-a.vel).slice(0,2).forEach(p=>o.push(['wn',`<b>Reorder ${esc(p.prod)}.</b> Selling ${p.vel.toFixed(1)} a day with ${p.stock} left (${Math.round(p.cover)} days). Order about ${p.q} units.`]));
 A.pr.filter(p=>p.slow).sort((a,b)=>(b.stock||0)*(b.cost||1)-(a.stock||0)*(a.cost||1)).slice(0,1).forEach(p=>o.push(['rd',`<b>Clear ${esc(p.prod)}.</b> Sold ${p.u30} in ${A.k} days${p.stock!=null?', '+p.stock+' still in stock'+(p.cost!=null?' ('+inr(p.stock*p.cost)+' at cost)':''):''}. Discount or bundle it.`]));
 if(d<-.08){const c=A.ct.slice().sort((a,b)=>(a.rev-a.rp)-(b.rev-b.rp))[0];o.push(['rd',`<b>Sales are down ${Math.round(-d*100)}%.</b> ${esc(c.cat)} fell the most (${inr(c.rev-c.rp)}). Ask "Why did sales change?" for the breakdown.`])}
 const x=A.an[A.an.length-1];if(x)o.push(['wn',`<b>Check ${wd(x.d)} ${dfmt(x.d)}.</b> Sales were ${inr(x.v)}, far ${x.z<0?'below':'above'} a normal ${wd(x.d)} (${inr(x.m)}).`]);
 if(!o.length)o.push(['','<b>No urgent actions.</b> Sales, stock and customers look steady.']);
 return o}

function chart(){
 const H=Math.min(60,A.n),s=A.S.slice(A.n-H).concat(A.F),ma=s.map((_,i)=>{let t=0,c=0;for(let j=Math.max(0,i-6);j<=i;j++){t+=s[j];c++}return t/c});
 const mx=Math.max(...ma)*1.1||1,W=600,Y=190,L=46,x=i=>L+i*(W-L-6)/(s.length-1),y=v=>Y-v/mx*(Y-14),t=H-1,pt=(a,b)=>ma.slice(a,b).map((v,i)=>x(a+i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
 return `<svg viewBox="0 0 ${W} ${Y+22}" width="100%" role="img" aria-label="Seven-day average of daily sales for the last ${H} days, then the 30-day forecast"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--tint);stop-opacity:.3"/><stop offset="1" style="stop-color:var(--tint);stop-opacity:0"/></linearGradient></defs><rect class="z" x="${x(t)}" y="4" width="${W-6-x(t)}" height="${Y-4}"/><line class="ax" x1="${L}" x2="${W-6}" y1="${Y}" y2="${Y}"/><text x="${L-6}" y="${y(mx/1.1)+4}" text-anchor="end">${inr(mx/1.1)}</text><text x="${L-6}" y="${Y+4}" text-anchor="end">0</text><polygon class="ar" points="${pt(0,t+1)} ${x(t)},${Y} ${L},${Y}"/><polyline class="l1" pathLength="1" points="${pt(0,t+1)}"/><circle class="dot" cx="${x(t)}" cy="${y(ma[t])}" r="5"/><polyline class="l2" points="${pt(t,ma.length)}"/><text x="${L}" y="${Y+16}">${dfmt(A.lo+A.n-H)}</text><text x="${x(t)}" y="${Y+16}" text-anchor="middle">today</text><text x="${W-6}" y="${Y+16}" text-anchor="end">${dfmt(A.lo+A.n+29)}</text><text x="${(x(t)+W-6)/2}" y="18" text-anchor="middle">forecast</text></svg>`}

function vOv(){
 const d=A.sales/(A.prev||1)-1,fs=A.F.reduce((a,b)=>a+b,0),base=A.sales*30/A.k;
 return `<div class="kp"><div class="k"><span>Sales, last ${A.k} days</span><b>${inr(A.sales)}</b><span class="${d<0?'dn':'up'}">${pct(d)} vs previous ${A.k}</span></div>
<div class="k"><span>Gross profit</span><b>${A.hasCost?inr(A.gp):'-'}</b><span>${A.hasCost?Math.round(A.gp/(A.sales||1)*100)+'% margin':'add a cost column'}</span></div>
<div class="k"><span>Average bill</span><b>${inr(A.sales/(A.bills||1))}</b><span>${A.bills} bills</span></div>
<div class="k"><span>Locked in slow stock</span><b>${A.hasStock?inr(A.locked):'-'}</b><span>${A.hasStock?A.pr.filter(p=>p.slow).length+' products, at cost':'add a stock column'}</span></div></div>
<h2>Do this week</h2><ul class="act">${acts().map(a=>`<li class="${a[0]}">${a[1]}</li>`).join('')}</ul>
<h2>Next 30 days</h2>${chart()}<p class="note">7-day average of daily sales. Expected ${inr(fs)}, ${pct(fs/(base||1)-1)} vs the last 30 days. Method: your weekday pattern from the last 4 weeks, adjusted for the recent trend.</p>
<h2>Categories</h2><div class="sc"><table><tr><th>Category</th><th>Sales</th><th>vs previous</th>${A.hasCost?'<th>Margin</th>':''}</tr>${A.ct.map(c=>`<tr><td>${esc(c.cat)}</td><td>${inr(c.rev)}</td><td class="${c.rev<c.rp?'dn':'up'}">${c.rp?pct(c.rev/c.rp-1):'new'}</td>${A.hasCost?`<td>${Math.round(c.gp/(c.rev||1)*100)}%</td>`:''}</tr>`).join('')}</table></div>`}

function vInv(){
 const st=p=>p.re?['t-w','Reorder']:p.slow?['t-r','Slow']:p.rise?['t-g','Rising']:['','Steady'],nx=p=>p.re?'Order ~'+p.q:p.slow?'Discount or bundle':p.rise?'Keep stocked':'-';
 const L=A.pr.slice().sort((a,b)=>(b.re-a.re)||(b.slow-a.slow)||(b.rev-a.rev));
 return `<h2>Stock and movement, last ${A.k} days</h2><div class="sc"><table><tr><th>Product</th><th>Status</th><th>Sold</th><th>In stock</th><th>Days left</th><th>Next step</th></tr>${L.map(p=>{const s=st(p);return `<tr><td>${esc(p.prod)}<small>${esc(p.cat)}</small></td><td><span class="tag ${s[0]}">${s[1]}</span></td><td>${p.u30}<small>was ${p.up30}</small></td><td>${p.stock==null?'-':p.stock}</td><td>${p.cover==null?'-':isFinite(p.cover)?Math.round(p.cover):'No sales'}</td><td>${nx(p)}</td></tr>`}).join('')}</table></div><p class="note">Reorder: under 21 days of stock. Slow: over 90 days of stock, or sales down by half. Order quantity covers 45 days of sales.</p>`}

function vCu(){
 if(!A.hasCust)return '<p class="note" style="margin-top:16px">No customer column found. Add a column named customer (name or phone number) to see repeat rate and customers who may not come back.</p>';
 const c=A.cu,rp=c.filter(x=>x.nb>1),rk=rp.filter(x=>x.gap>45).sort((a,b)=>b.rev-a.rev);
 const tb=l=>`<div class="sc"><table><tr><th>Customer</th><th>Bills</th><th>Spent</th><th>Last bill</th></tr>${l.slice(0,8).map(x=>`<tr><td>${esc(x.id)}</td><td>${x.nb}</td><td>${inr(x.rev)}</td><td>${x.gap} days ago</td></tr>`).join('')}</table></div>`;
 return `<div class="kp"><div class="k"><span>Customers</span><b>${c.length}</b></div><div class="k"><span>Repeat rate</span><b>${Math.round(rp.length/c.length*100)}%</b><span>bought 2+ times</span></div><div class="k"><span>May not return</span><b>${rk.length}</b><span>repeat buyers, 45+ days away</span></div></div>
<h2>Win these back</h2>${rk.length?tb(rk)+'<p class="note">Send a WhatsApp offer to the biggest spenders first.</p>':'<p class="note">No repeat customer is overdue.</p>'}<h2>Top customers</h2>${tb(c.slice().sort((a,b)=>b.rev-a.rev))}`}

function vAl(){
 const a=A.an.slice().reverse();
 return `<h2>Unusual days, last 60 days</h2>`+(a.length?`<ul class="act">${a.map(x=>`<li class="${x.z<0?'rd':'wn'}"><b>${wd(x.d)} ${dfmt(x.d)}: ${inr(x.v)}</b> vs ${inr(x.m)} on a typical ${wd(x.d)} (${Math.abs(Math.round((x.v/(x.m||1)-1)*100))}% ${x.z<0?'below':'above'}).<br><span class="note">${x.z<0?'Check for a closure, power cut, stock-out or missing bills.':'Check what drove it: a festival, sale or bulk order.'}</span></li>`).join('')}</ul>`:'<p class="note">No unusual days. Sales stayed in the normal range for each weekday.</p>')+'<p class="note">A day is flagged when sales are far outside the same weekday over the previous 8 weeks.</p>'}

function vAsk(){
 const Q=['Why did sales change this month?','What should I purchase next?','Which category has the highest margin?','Which products are slow-moving?','Which customers are likely to return?'];
 return `<div class="chips">${Q.map(q=>`<button class="btn" data-q="${q}">${q}</button>`).join('')}</div><div class="ask"><input id="qi" placeholder="Ask about your shop" aria-label="Ask a question"><button class="btn" data-go="1">Ask</button></div>${chat.map(c=>`<div class="msg"><div class="q">${esc(c.q)}</div><div class="a">${c.a}</div></div>`).join('')}<p class="note">Answers are calculated only from your data, with the numbers shown. You can ask in English or Hinglish.</p>`}

function ans(q){
 q=q.toLowerCase();const h=(...w)=>w.some(x=>q.includes(x)),d=A.sales/(A.prev||1)-1;
 if(h('why','fall','drop','declin','kam','gir','change')){
  const c=A.ct.slice().sort((a,b)=>(a.rev-a.rp)-(b.rev-b.rp));if(d>0)c.reverse();
  const bd=A.bills/(A.pbills||1)-1,ad=(A.sales/(A.bills||1))/((A.prev/(A.pbills||1))||1)-1;
  return `<p>Sales ${d<0?'fell':'rose'} ${Math.abs(Math.round(d*100))}%: ${inr(A.sales)} in the last ${A.k} days vs ${inr(A.prev)} before.</p>`+li([`Bills ${pct(bd)}, average bill ${pct(ad)}`,...c.slice(0,3).map(x=>`${esc(x.cat)}: ${inr(x.rev-x.rp)}`)])+`<p><b>Action:</b> ${Math.abs(bd)>Math.abs(ad)?'Fewer customers drove this. Message past customers with an offer.':'Smaller bills drove this. Bundle items or add a minimum-bill discount.'}</p>`}
 if(h('purchas','buy','reorder','order','kharid')){
  const r=A.pr.filter(p=>p.re).sort((a,b)=>b.vel-a.vel).slice(0,4),s=A.pr.filter(p=>p.slow).slice(0,3);
  if(!A.hasStock)return '<p>There is no stock column, so I can only rank by sales. Best sellers:</p>'+li(A.pr.slice().sort((a,b)=>b.u30-a.u30).slice(0,4).map(p=>`${esc(p.prod)}: ${p.u30} sold`))+'<p>Add a stock column for exact reorder quantities.</p>';
  return `<p>${r.length?'Reorder these first:':'Nothing is running low right now.'}</p>`+(r.length?li(r.map(p=>`${esc(p.prod)}: ${p.vel.toFixed(1)} a day, ${p.stock} left (${Math.round(p.cover)} days). Order about ${p.q}`)):'')+(s.length?`<p><b>Hold off on:</b> ${s.map(p=>esc(p.prod)).join(', ')} (slow-moving).</p>`:'')}
 if(h('margin','profit','munafa','fayda')){
  if(!A.hasCost)return '<p>I need a cost column to calculate margin. Add the cost price per item and upload again.</p>';
  const c=A.ct.slice().sort((a,b)=>b.gp/(b.rev||1)-a.gp/(a.rev||1)),p=A.pr.slice().sort((a,b)=>b.gp-a.gp).slice(0,3);
  return `<p><b>${esc(c[0].cat)}</b> has the highest margin at ${Math.round(c[0].gp/(c[0].rev||1)*100)}%.</p>`+li(c.map(x=>`${esc(x.cat)}: ${Math.round(x.gp/(x.rev||1)*100)}% margin, ${inr(x.gp)} profit`))+`<p>Most profit by product: ${p.map(x=>esc(x.prod)+' ('+inr(x.gp)+')').join(', ')}.</p>`}
 if(h('slow','dead','unsold')){
  const s=A.pr.filter(p=>p.slow).sort((a,b)=>(b.stock||0)*(b.cost||1)-(a.stock||0)*(a.cost||1));
  return s.length?`<p>${s.length} slow-moving product${s.length>1?'s':''}${A.hasStock?', '+inr(A.locked)+' locked at cost':''}:</p>`+li(s.slice(0,5).map(p=>`${esc(p.prod)}: ${p.u30} sold vs ${p.up30} before${p.stock!=null?', '+p.stock+' in stock':''}`))+'<p><b>Action:</b> Discount or bundle these and pause reorders.</p>':'<p>No slow-moving products found.</p>'}
 if(h('customer','repeat','return','grahak')){
  if(!A.hasCust)return '<p>There is no customer column. Add one to see repeat behaviour.</p>';
  const r=A.cu.filter(x=>x.nb>1),k=r.filter(x=>x.gap>45).sort((a,b)=>b.rev-a.rev);
  return `<p>${Math.round(r.length/A.cu.length*100)}% of customers (${r.length} of ${A.cu.length}) have bought more than once.</p>`+(k.length?`<p>${k.length} repeat customers have not bought in 45+ days and may drift away. Biggest spenders: ${k.slice(0,5).map(x=>esc(x.id)+' ('+x.gap+' days)').join(', ')}.</p><p><b>Action:</b> Send them a WhatsApp offer this week.</p>`:'<p>No repeat customer is overdue.</p>')}
 if(h('forecast','demand','expect','agle')){
  const f=A.F.reduce((a,b)=>a+b,0),b=A.sales*30/A.k;
  return `<p>Expected sales for the next 30 days: <b>${inr(f)}</b>, ${pct(f/(b||1)-1)} vs the last 30 days.</p><p>Best sellers to keep stocked: ${A.pr.slice().sort((a,b)=>b.u30-a.u30).slice(0,3).map(p=>esc(p.prod)).join(', ')}.</p>`}
 return '<p>I can answer questions about sales changes, what to purchase, margin, slow movers, customers and the 30-day forecast. Tap a question above or type one.</p>'}

function askQ(q){chat.unshift({q,a:ans(q)});tab='ask';render()}
function render(){
 const i=TABS.findIndex(t=>t[0]==tab);$('tabs').style.setProperty('--i',i);
 document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t==tab));
 $('lt').textContent=$('bt').textContent=TABS[i][1];
 const m=$('main');m.innerHTML=({ov:vOv,inv:vInv,cu:vCu,al:vAl,ask:vAsk}[tab])();
 if(!matchMedia('(prefers-reduced-motion:reduce)').matches)m.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'})}
function setData(R,name){
 A=analyse(R);chat=[];tab='ov';
 $('sn').textContent=name+' · '+R.length.toLocaleString('en-IN')+' rows · '+iso(A.lo)+' to '+iso(A.hi);render();closeS()}
function load(t,name){
 const T=csv(t);if(T.length<2)return msg('No data rows found. Add a header row and at least one sale.');
 const h=T[0].map(x=>x.trim().toLowerCase()),ix=(...a)=>{const i=h.findIndex(x=>a.includes(x));return i>=0?i:h.findIndex(x=>a.some(y=>x.includes(y)))};
 const c={d:ix('date'),p:ix('product','item'),q:ix('qty','quantity'),r:ix('price','rate'),b:ix('bill','invoice'),u:ix('customer','phone'),g:ix('category'),o:ix('cost'),s:ix('stock')};
 const miss=[['date',c.d],['product',c.p],['qty',c.q],['price',c.r]].filter(x=>x[1]<0).map(x=>x[0]);
 if(miss.length)return msg('Missing column: '+miss.join(', ')+'. Check the header row of your CSV.');
 const R=[];let bad=0;
 T.slice(1).forEach((r,j)=>{const d=pd(r[c.d]),q=num(r[c.q]),p=num(r[c.r]);if(isNaN(d)||q==null||p==null||!r[c.p]){bad++;return}
  R.push({d:Math.round(d),bill:(c.b>=0&&r[c.b])||'L'+j,cust:c.u>=0?(r[c.u]||'').trim():'',prod:r[c.p].trim(),cat:(c.g>=0&&r[c.g]&&r[c.g].trim())||'Uncategorised',qty:q,price:p,cost:c.o>=0?num(r[c.o]):null,stock:c.s>=0?num(r[c.s]):null})});
 const ds=new Set(R.map(r=>r.d)).size;if(ds<14)return msg('Need at least 14 days of sales. Found '+ds+'.');
 msg(bad?bad+' rows skipped because of a bad date, qty or price.':'');setData(R,name)}

const sheet=$('sh'),openS=()=>sheet.classList.add('on'),closeS=()=>sheet.classList.remove('on');
addEventListener('scroll',()=>document.body.classList.toggle('sc',scrollY>40),{passive:true});
addEventListener('keydown',e=>{if(e.key==='Escape')closeS()});
document.addEventListener('click',e=>{
 let t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;scrollTo(0,0);render();return}if(e.target.closest('#ds')){openS();return}if(e.target.closest('[data-close]')){closeS();return}
 t=e.target.closest('[data-q]');if(t){askQ(t.dataset.q);return}
 if(e.target.closest('[data-go]')){const v=$('qi').value.trim();if(v)askQ(v)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='qi'){const v=e.target.value.trim();if(v)askQ(v)}});
$('bs').onclick=()=>{msg('');setData(sample(),'Sample store (demo data)')};
$('f').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>load(r.result,f.name);r.readAsText(f);e.target.value=''};
setData(sample(),'Sample store (demo data)');
</script>
