// ---------------- RUBBER-BAND (spring physics) ----------------
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const A = document.getElementById('app'), MAX = 130, K = MAX/.55, se = () => document.scrollingElement || document.documentElement;
  let sx=0, sy=0, lx=0, ly=0, axis='', dir=0, raw=0, rawX=0, ox=0, oy=0, vx=0, vy=0, raf=0, ign=true;
  const rub = v => MAX*v/(v+K), inv = o => K*o/Math.max(MAX-o,1);
  const atTop = () => { const t = se().scrollTop; return t <= 0 && t > -1; };
  const atBot = () => { const e = se(), m = e.scrollHeight - e.clientHeight; return e.scrollTop >= m-1 && e.scrollTop < m+1; };
  function paint(){ A.style.transform = `translate3d(${ox}px,${oy}px,0) scale(${1+Math.abs(ox)/1400},${1+Math.max(0,oy*dir)/1000})`; }
  function reset(){ ox=oy=vx=vy=0; dir=0; A.style.transform=''; A.style.transformOrigin=''; A.style.willChange=''; }
  function spring(){
    cancelAnimationFrame(raf); let t0 = performance.now();
    const step = t => {
      const dt = Math.min(.032,(t-t0)/1000); t0 = t;
      vy += (-240*oy - 14*vy)*dt; oy += vy*dt;
      vx += (-240*ox - 14*vx)*dt; ox += vx*dt;
      if(Math.abs(oy)+Math.abs(ox) < .2 && Math.abs(vy)+Math.abs(vx) < 4){ reset(); return; }
      paint(); raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  addEventListener('touchstart', e => {
    ign = e.touches.length > 1 || !!(e.target.closest && e.target.closest('input,select,textarea,.overlay'));
    if(ign) return;
    const t = e.touches[0]; cancelAnimationFrame(raf);
    sx = lx = t.clientX; sy = ly = t.clientY; axis = '';
    raw = oy ? inv(Math.abs(oy)) : 0; rawX = ox ? Math.sign(ox)*inv(Math.abs(ox)/.35) : 0;
    A.style.willChange = 'transform';
  }, {passive:true});
  addEventListener('touchmove', e => {
    if(ign) return;
    const t = e.touches[0], dy = t.clientY-ly, dx = t.clientX-lx; lx = t.clientX; ly = t.clientY;
    if(!axis){
      const ax = Math.abs(t.clientX-sx), ay = Math.abs(t.clientY-sy);
      if(ax < 6 && ay < 6) return;
      axis = ax > ay ? 'x' : 'y';
    }
    if(axis === 'y'){
      if(raw <= 0){
        if(dy > 0 && atTop()) dir = 1; else if(dy < 0 && atBot()) dir = -1; else return;
        raw = 0; A.style.transformOrigin = dir > 0 ? '50% 0' : '50% 100%';
      }
      raw += dy*dir;
      if(raw <= 0){ raw = 0; oy = 0; paint(); return; }
      oy = dir*rub(raw);
      if(e.cancelable) e.preventDefault();
      paint();
    }else{
      rawX += dx; ox = Math.sign(rawX)*rub(Math.abs(rawX))*.35; paint();
    }
  }, {passive:false});
  const end = () => { if(ox || oy) spring(); else reset(); };
  addEventListener('touchend', end, {passive:true});
  addEventListener('touchcancel', end, {passive:true});
})();

}

}

const BRANCHES = ["CSE","IT"];
const SEMESTERS_BY_YEAR = {
  "1st Year": ["Semester 1","Semester 2"],

let studyState = {};
function showStudyHome(){
  render(`
    ${topbar("Study Material","showHome")}
    <div class="card">
      <label>Your Name</label>
      <input id="study_name" placeholder="Enter your name">
      <button class="btn" onclick="studySetName()">Continue</button>
    </div>
  `);
}
function studySetName(){
  const name = document.getElementById("study_name").value.trim();
  if(!name){ return; }
  studyState = { name };
  showStudyBranch();
}
function showStudyBranch(){
  render(`

function startMockTest(){
  const data = getCurrentSubjectData();
  const questions = (data && data.mockTest) ? data.mockTest.slice(0,10) : [];
  if(questions.length===0){
    render(`${topbar("Mock Test", `()=>showSubjectOptions()`)}<p class="empty">No mock test added yet for this subject.</p>`);
    return;
  }
  studyState.quiz = { questions, index:0, score:0 };
  renderMockQuestion();

  const { questions, index } = studyState.quiz;
  const q = questions[index];
  render(`

    <div class="card">
      <p class="sub" style="color:var(--text); font-size:1.05rem;">${esc(q.q)}</p>
      ${q.options.map((opt,i)=>`<button class="btn secondary" onclick="answerMock(${i})">${esc(opt)}</button>`).join('')}
    </div>
  `);
}
function answerMock(selected){
  const { questions, index } = studyState.quiz;
  if(selected === questions[index].correct){ studyState.quiz.score += 2; }
  studyState.quiz.index++;
  if(studyState.quiz.index >= questions.length){
    showMockResult();
  }else{
    renderMockQuestion();
  }
}
function showMockResult(){
  const { questions, score } = studyState.quiz;
  render(`
    ${topbar("Mock Test Result", `()=>showSubjectOptions()`)}
    <div class="card" style="text-align:center;">
      <h1>${score} / ${questions.length*2}</h1>
      <p class="sub">Great effort, ${esc(studyState.name)}!</p>
      <button class="btn" onclick="startMockTest()">🔁 Retry</button>
    </div>
  `);
}

function showRegisterForm(){

  render(formHtml(null,false));
}
function readForm(){
  return {
    name: document.getElementById("f_name").value.trim(),
    branch: document.getElementById("f_branch").value.trim(),
    course: document.getElementById("f_course").value.trim(),
    project: document.getElementById("f_project").value.trim(),
    password: document.getElementById("f_password").value,
    secretAnswer: document.getElementById("f_secret").value.trim(),
    presentation: document.getElementById("f_presentation").value.trim(),
    prototype: document.getElementById("f_prototype").value.trim(),
    year: document.getElementById("f_year").value,
    section: document.getElementById("f_section").value,
  };
}
function validate(d, isUpdate){
  if(!d.name) return "Please enter student name.";
  if(!d.branch) return "Please enter branch.";
  if(!d.course) return "Please enter course.";
  if(!d.project) return "Please enter project name.";
  if(!isUpdate && (!d.password || d.password.length < 4)) return "Please set a password (at least 4 characters).";
  if(!isUpdate && !d.secretAnswer) return "Please set a security answer.";
  if(!d.year) return "Please select year.";
  if(!d.section) return "Please select section.";
  return null;
}
async function saveRegistration(){
  const d = readForm();
  const err = validate(d, false);
  const statusEl = document.getElementById("formstatus");
  if(err){ statusEl.textContent = err; return; }
  if(!dbReady) await initDb();
  if(!db){ statusEl.textContent = "Could not save — data storage is unavailable."; return; }
  try{
    await db.collection("students").add({...d, resetCount: 0, createdAt: Date.now()});
    alert("Registration saved successfully!");
    showStudentMenu();
  }catch(e){ statusEl.textContent = "Save fail: " + (e.message||e); }
}
async function saveUpdate(){
  const d = readForm();
  const err = validate(d, true);
  const statusEl = document.getElementById("formstatus");
  if(err){ statusEl.textContent = err; return; }
  if(!db || !editingId){ statusEl.textContent = "Update fail."; return; }
  if(!d.password){ delete d.password; } // keep existing password if left blank
  try{
    await db.collection("students").doc(editingId).update(d);
    alert("Details updated successfully!");
    showStudentMenu();
  }catch(e){ statusEl.textContent = "Update fail: " + (e.message||e); }
}

}

    const x = d.exists ? d.data() : null;
    if(x && x.count > 0){ const a = (x.sum/x.count).toFixed(1); mini = a+' · Tap to rate'; full = `${a} average · ${x.count} rating${x.count>1?'s':''}`; }

  const m = document.getElementById('miniAvg'), a = document.getElementById('avg');
  if(m) m.textContent = mini; if(a) a.textContent = full;
}
async function submitRating(){
  const prev = getMine(), n = myRate; if(!n) return;
  const btn = document.getElementById('rateBtn'), msg = document.getElementById('rateMsg');
  btn.disabled = true;
  try{ localStorage.setItem(RK, n); }catch(e){}
  try{
    if(!dbReady) await initDb();
    const inc = firebase.firestore.FieldValue.increment;
    await db.collection('app_meta').doc('rating').set({sum:inc(n-prev), count:inc(prev?0:1)}, {merge:true});
    msg.textContent = 'Thanks for rating! 💜';
  }catch(e){ msg.textContent = 'Thanks! Your rating is saved on this device. 💜'; }
  btn.textContent = 'Update rating'; btn.disabled = false; loadRating();
}
function openSheet(id, html){
  const cur = document.querySelector('.overlay:not(.out):not(.lb)');
  if(cur){ cur.id = id; const b = cur.querySelector('.sheet-body'); b.innerHTML = html; b.scrollTop = 0; b.classList.remove('swap'); void b.offsetWidth; b.classList.add('swap'); return; }
  closeSheets();
  const o = document.createElement('div');
  o.className = 'overlay'; o.id = id;
  o.onclick = e => { if(e.target === o) closeSheets(); };
  o.innerHTML = `<div class="sheet" role="dialog"><div class="grab"></div><div class="sheet-body">${html}</div><div class="sheet-foot"><button class="btn secondary" style="margin:0" onclick="closeSheets()">Close</button></div></div>`;
  document.body.appendChild(o);
  document.body.style.overflow = 'hidden';
}
function closeSheets(){ document.querySelectorAll('.overlay:not(.out)').forEach(x=>{ x.classList.add('out'); setTimeout(()=>x.remove(),260); }); document.body.style.overflow = ''; }
function closeInfoSheet(){ closeSheets(); }

}

function achHtml(){
  return CERTS.map((c,i)=>`<button class="ach" onclick="viewCert(${i})"><img src="${c.img}" alt="${c.t} certificate"><div class="at"><b>${c.t}</b><small>${c.by}${c.d?' · '+c.d:''}</small><small>${c.s}</small></div></button>`).join('');
}
function showAchievements(){
  openSheet('achOverlay', topbar("Owner's Achievements","showInfoSheet") + '<p class="sub" style="margin:-8px 0 6px">Tap a certificate to view it full size.</p>' + achHtml());
}
function viewCert(i){
  const c = CERTS[i], o = document.createElement('div');
  o.className = 'overlay lb';
  o.onclick = () => { o.classList.add('out'); setTimeout(()=>o.remove(),260); };
  o.innerHTML = `<img src="${c.img}" alt="${c.t}"><p>${c.t} · tap to close</p>`;
  document.body.appendChild(o);
}
function showInfoSheet(){
  openSheet('infoOverlay', `<h2>About this app</h2>
    <p class="sub" style="margin-bottom:8px">Made by <b class="hl">Rishabh Raj Dubey</b></p>
    <div class="info-item"><span class="chip">🌐</span><div><div class="t">HTML, CSS & JavaScript</div><div class="d">The entire app's structure, design, and behavior are built with plain HTML/CSS/JavaScript — no framework needed, so it runs instantly in any browser.</div></div></div><div class="info-item"><span class="chip">🔥</span><div><div class="t">Google Firebase (Firestore)</div><div class="d">Used as the live database — stores all student registrations, teacher login details, and academic content so everyone sees the same up-to-date data in real time.</div></div></div><div class="info-item"><span class="chip">🐙</span><div><div class="t">GitHub Pages</div><div class="d">Free hosting service used to publish this website online, giving it a public link anyone can open on their phone or computer.</div></div></div><div class="info-item"><span class="chip">🅰️</span><div><div class="t">Google Fonts (Poppins & Inter)</div><div class="d">Used for clean, modern, premium-looking typography throughout the app.</div></div></div><div class="info-item"><span class="chip">🤖</span><div><div class="t">Claude (Anthropic AI)</div><div class="d">Used by <span style="font-weight:700; color:var(--primary);">Rishabh Raj Dubey</span> to design, code, and continuously improve this app based on feedback.</div></div></div><div class="info-item"><span class="chip">👤</span><div><div class="t">About the Developer</div><div class="d">This app was built by <span style="font-weight:700; color:var(--primary);">Rishabh Raj Dubey</span>, a B.Tech student, entirely from a phone — with no prior coding background — by working step-by-step with Claude AI to bring the idea to life.</div></div></div><div style="padding:14px 0 6px"><button class="btn" style="margin:0" onclick="showAchievements()">🏆 Open Achievements (${CERTS.length})</button></div><div class="info-item"><span class="chip">⚠️</span><div><div class="t">Challenges Faced While Building</div><div class="d">Setting up Firebase and connecting it to the app for the first time; learning how to upload and edit files on GitHub from a mobile browser; a blank-page issue caused by an incomplete copy-paste of a large file on mobile, which took some troubleshooting to identify; and understanding how free hosting (GitHub Pages) and app packaging (PWABuilder) work — all learned along the way while building this project.</div></div></div>`);
}

// init
showHome();
</script>
